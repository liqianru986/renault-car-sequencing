# Python 项目元数据：声明包、Python 版本、可选求解器与开发工具。

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renault-car-sequencing"
version = "0.1.0"
description = "Reproducible solver framework for the ROADEF 2005 Renault Car Sequencing problem."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
renault-cs = "renault_cs.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]
gurobi = ["gurobipy>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
